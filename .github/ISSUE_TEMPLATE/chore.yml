name: 환경 설정 및 기타
description: 패키지 의존성 변경, 빌드 스크립트 수정, 파일 정리 등 코드 로직 외의 설정 작업을 진행합니다.
title: "[설정] "
labels: ["chore"]
body:
  - type: textarea
    id: purpose
    attributes:
      label: 작업 목적
      description: 해당 설정 변경이나 인프라 작업이 왜 필요한가요?
      placeholder: 패키지 설치 배경 또는 환경 설정 추가 목적을 입력해 주세요.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 구체적으로 어떤 설정 파일이나 스크립트를 변경하나요?
      placeholder: "수정이 필요한 대상 파일(예: package.json, webpack, Dockerfile 등)과 작업 범위를 입력해 주세요."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 플러그인 레퍼런스, 배포 시 유의사항 등을 적어주세요.
    validations:
      required: false
